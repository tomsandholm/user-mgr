---
- name: Remove legacy user-mgr block from /etc/group
  ansible.builtin.blockinfile:
    path: "{{ group_file }}"
    marker: "# {mark} {{ legacy_group_block_marker }}"
    state: absent
  failed_when: false

- name: Ensure groups from export exist
  ansible.builtin.group:
    name: "{{ line_parts[0] }}"
    gid: "{{ line_parts[2] | int }}"
    state: present
  loop: "{{ user_mgr_group_lines }}"
  loop_control:
    label: "{{ line_parts[0] }}"
  vars:
    line_parts: "{{ item.split(':') }}"
  when:
    - line_parts | length >= 4
    - line_parts[1] == 'x'

- name: Read current group members from the system
  ansible.builtin.command:
    cmd: getent group {{ line_parts[0] }}
  loop: "{{ user_mgr_group_lines }}"
  loop_control:
    label: "{{ line_parts[0] }}"
  vars:
    line_parts: "{{ item.split(':') }}"
  when:
    - line_parts | length >= 4
    - line_parts[1] == 'x'
    - (line_parts[3] | default('')) | length > 0
  register: user_mgr_getent_groups
  changed_when: false

- name: Set supplementary group members from export
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      group={{ group_name | quote }}
      desired={{ desired_members_raw | quote }}
      valid_list=()
      IFS=',' read -ra parts <<< "$desired"
      for n in "${parts[@]}"; do
        n="${n// /}"
        [[ -z "$n" ]] && continue
        if getent passwd "$n" >/dev/null 2>&1; then
          valid_list+=("$n")
        fi
      done
      valid=$(IFS=,; echo "${valid_list[*]}")
      current=$(getent group "$group" | cut -d: -f4-)
      current="${current#:}"
      if [[ "$current" == "$valid" ]]; then
        echo unchanged
        exit 0
      fi
      gpasswd -M "$valid" "$group"
      echo changed
    executable: /bin/bash
  vars:
    line_parts: "{{ item.item.split(':') }}"
    group_name: "{{ line_parts[0] }}"
    desired_members_raw: "{{ line_parts[3] | default('') }}"
    current_members: "{{ (item.stdout.split(':')[3] | default('')) | trim }}"
  loop: "{{ user_mgr_getent_groups.results }}"
  loop_control:
    label: "{{ group_name }}"
  when:
    - not item.skipped | default(false)
  register: user_mgr_gpasswd_results
  changed_when: (stdout | default('')) | trim == 'changed'
  failed_when: rc != 0

- name: Synchronize gshadow entries with group
  ansible.builtin.command:
    cmd: grpconv
  changed_when: true
