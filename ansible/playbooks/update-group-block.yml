---
# Apply groups from the user-mgr MySQL database (groupadd/groupmod and gpasswd).
#
#   cd ~/prog/user-mgr
#   ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook ansible/playbooks/update-group-block.yml
#
# Database connection uses DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS (see vars/user_mgr_db.yml).

- name: Install user-mgr group export on virt hosts
  hosts: virt
  become: true
  gather_facts: false
  serial: 1

  vars_files:
    - vars/user_mgr_db.yml

  vars:
    group_file: /etc/group
    legacy_group_block_marker: user-mgr managed groups

  pre_tasks:
    - name: Load group lines from database
      ansible.builtin.import_tasks: tasks/load-group-from-db.yml

  tasks:
    - name: Apply group lines
      ansible.builtin.import_tasks: tasks/apply-group-export.yml
