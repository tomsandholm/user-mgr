---
# Apply user accounts from the user-mgr MySQL database (ansible.builtin.user).
#
#   cd ~/prog/user-mgr
#   ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook ansible/playbooks/update-passwd-block.yml
#
# Run update-group-block.yml first if primary groups are not on the host yet.
#
# Database connection uses DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS (see vars/user_mgr_db.yml).

- name: Install user-mgr passwd export on virt hosts
  hosts: virt
  become: true
  gather_facts: false
  serial: 1

  vars_files:
    - vars/user_mgr_db.yml

  vars:
    passwd_file: /etc/passwd
    legacy_passwd_block_marker: user-mgr managed users

  pre_tasks:
    - name: Load passwd lines from database
      ansible.builtin.import_tasks: tasks/load-passwd-from-db.yml

  tasks:
    - name: Apply passwd lines
      ansible.builtin.import_tasks: tasks/apply-passwd-export.yml
