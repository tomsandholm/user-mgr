services:

  web:
    build: 
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./exports:/exports
      - ./ansible:/ansible
      - ./ansible-keys:/root/.ssh:ro
      - /etc/hosts:/etc/hosts
    environment:
      DB_HOST: db
      DB_NAME: users
      DB_USER: root
      DB_PASS: theresa1
      ADMIN_USER: admin
      ADMIN_PASS: theresa1
    depends_on:
      - db

#  ansible:
#    build:
#      context: ./ansible
#      dockerfile: Dockerfile
#    volumes:
#      - ./ansible:/ansible
#      - ./ansible-keys:/root/.ssh:ro
#      - ./exports:/home/ansible/exports:rw
#      - /etc/hosts:/etc/hosts
#    environment:
#      - ANSIBLE_CONFIG=/ansible/ansible.cfg
#    tty: true
#    stdin_open: true

  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: theresa1
      MYSQL_DATABASE: users
      MYSQL_USER: sysadm
      MYSQL_PASSWORD: theresa1
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
    depends_on:
      - db


volumes:
  db_data:

